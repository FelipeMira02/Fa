<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c0e">
  <meta name="description" content="Uma música por dia, só para você, Franjuda.">
  <title>Para a Franjuda ♡</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23100c0e'/%3E%3Ctext x='16' y='25' font-family='Georgia' font-size='27' text-anchor='middle' fill='%23bd7283'%3Ef%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=UnifrakturMaguntia&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="masthead"><span>PARA ANA, COM CARINHO</span><span class="tiny-heart" aria-hidden="true">♡</span><span>UMA MÚSICA POR DIA</span></header>
    <section class="dedication" aria-labelledby="title">
      <div class="portrait">
        <img src="assets/ana.jpeg" alt="Ana, a Franjuda, em uma foto em preto e branco" width="720" height="1280" fetchpriority="high">
      </div>
      <div class="listening-room">
        <div class="date-line"><span id="today"></span><span aria-hidden="true">✦</span></div>
        <div class="greeting"><p class="eyebrow">ESTA É PARA VOCÊ,</p><h1 id="title">Franjuda<span class="title-star" aria-hidden="true">✧</span></h1><p class="intro">Tem coisas que uma música diz melhor.</p></div>
        <section class="song" aria-labelledby="song-title">
          <div class="song-label"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>A MÚSICA DE HOJE</span></div>
          <h2 id="song-title">Carregando…</h2><p id="artist" class="artist" aria-live="polite"></p>
          <div class="player" aria-label="Player da música de hoje">
            <button id="play-button" type="button" aria-label="Tocar música" disabled><span aria-hidden="true">▶</span></button>
            <div class="timeline"><label class="sr-only" for="progress">Progresso da música</label><input id="progress" type="range" min="0" max="100" value="0" step="0.1" disabled><div class="times"><span id="current-time">0:00</span><span id="duration">0:00</span></div></div>
            <audio id="audio" preload="metadata"></audio>
          </div>
          <p id="player-error" class="player-error" role="status" hidden></p>
        </section>
        <div class="note-box"><p id="note">não atiça</p></div>
        <div class="tomorrow"><span aria-hidden="true">♡</span> amanhã tem mais uma.</div>
      </div>
    </section>
    <footer><span class="footer-dedication">Só para você, Franjuda.</span><span aria-hidden="true">✧ &nbsp; ♡ &nbsp; ✧</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
